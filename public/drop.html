<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <title>Share a file — ShareSecure</title>
  <link rel="icon" type="image/png" href="/app-icon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preload" href="/fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="ShareSecure home">
      <img src="/app-icon.png" alt="" width="28" height="28" />
      <span>ShareSecure</span>
    </a>
  </header>

  <main class="auth-main">
    <section class="auth-panel drop-panel" aria-labelledby="drop-title">
      <div class="auth-head">
        <h1 id="drop-title">Share a file</h1>
        <p class="auth-sub">Your AI assistant asked to share a file for you. Pick it here and you’ll get the link.</p>
      </div>

      <form class="auth-form" id="drop-form" novalidate>
        <div class="drop-zone" id="drop-zone" role="button" tabindex="0" aria-label="Choose a file to share">
          <span class="drop-badge"><svg class="drop-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><polyline points="7 9 12 4 17 9"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
          <p class="drop-label" id="drop-label">Choose a file</p>
          <p class="drop-limit">PDF, DOCX, PNG or JPG, up to 10 MB</p>
          <input type="file" id="drop-input" accept=".pdf,.docx,.png,.jpg,.jpeg" hidden />
        </div>
        <p class="auth-error" id="drop-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="drop-submit" disabled>Share it</button>
      </form>

      <div class="drop-done hidden" id="drop-done">
        <p class="drop-done-title">Link created</p>
        <a class="result-url" id="drop-link" href="#" target="_blank" rel="noopener noreferrer"></a>
        <div class="result-actions">
          <button class="btn btn-primary" id="drop-copy">Copy link</button>
          <a class="btn btn-ghost" id="drop-open" href="#" target="_blank" rel="noopener noreferrer">Open</a>
        </div>
        <p class="auth-note" id="drop-note">Your assistant can get this link too: ask it to list your shares.</p>
      </div>
    </section>
  </main>

  <script src="/drop.js"></script>
</body>
</html>
