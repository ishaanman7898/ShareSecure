<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light dark" />
  <title>Sign in | ShareSecure</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preload" href="/fonts/schibsted-grotesk.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="auth-page">
  <header class="topbar">
    <a class="brand" href="/" aria-label="ShareSecure home">
      <img src="/rosette.svg" alt="" width="28" height="28" />
      <span>ShareSecure</span>
    </a>
    <a class="btn btn-ghost" href="/" id="auth-back">Back</a>
  </header>

  <main class="auth-main">
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-head">
        <h1 id="auth-title">Sign in</h1>
        <p class="auth-sub" id="auth-sub"></p>
      </div>

      <form id="auth-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="auth-username">Username <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="auth-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </div>
        <div class="form-group">
          <label for="auth-password">Password <span class="req" aria-hidden="true">*</span> <span class="label-hint" id="password-hint"></span></label>
          <div class="password-field">
            <input type="password" id="auth-password" name="password" autocomplete="current-password" required />
            <button type="button" class="btn-icon password-toggle" aria-controls="auth-password" aria-label="Show password" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="eye-slash" x1="2" y1="2" x2="22" y2="22"/></svg></button>
          </div>
        </div>
        <div class="form-group hidden" id="confirm-group">
          <label for="auth-confirm">Confirm password <span class="req" aria-hidden="true">*</span></label>
          <div class="password-field">
            <input type="password" id="auth-confirm" name="confirm" autocomplete="new-password" />
            <button type="button" class="btn-icon password-toggle" aria-controls="auth-confirm" aria-label="Show password" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="eye-slash" x1="2" y1="2" x2="22" y2="22"/></svg></button>
          </div>
        </div>
        <div class="form-group hidden" id="setup-code-group">
          <label for="auth-setup-code">Setup code <span class="req" aria-hidden="true">*</span> <span class="label-hint">shown where ShareSecure is running</span></label>
          <input type="text" id="auth-setup-code" name="setup_code" autocomplete="off" autocapitalize="none" spellcheck="false" />
        </div>
        <p class="auth-error" id="auth-error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="auth-submit">Sign in</button>
        <p class="auth-note hidden" id="auth-note"></p>
        <p class="auth-legal hidden" id="auth-legal">By continuing you agree to the <a href="/terms" target="_blank">Terms</a> and <a href="/privacy" target="_blank">Privacy policy</a>.</p>
      </form>

      <p class="auth-switch" id="auth-switch"></p>
    </section>
  </main>

  <script type="module" src="/signin.js"></script>
</body>
</html>
