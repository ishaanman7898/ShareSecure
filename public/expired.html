<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/png" href="/app-icon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Link expired — ShareSecure</title>
  <style>
    @font-face { font-family: 'Schibsted Grotesk'; font-weight: 400 900; font-display: swap; src: url('/fonts/schibsted-grotesk.woff2') format('woff2'); }
    :root { --paper:#fff; --ink:#000; --muted:#6b6b6b; --accent:#000; --on-accent:#fff; }
    @media (prefers-color-scheme: dark) { :root { --paper:#000; --ink:#fff; --muted:#8c8c8c; --accent:#fff; --on-accent:#000; } }
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:'Schibsted Grotesk', system-ui, sans-serif; }
    .box { max-width:360px; }
    h1 { font-size:1.6rem; font-weight:600; letter-spacing:-0.02em; margin:20px 0 8px; }
    p { color:var(--muted); line-height:1.55; }
    a { display:inline-flex; align-items:center; min-height:44px; margin-top:24px; padding:0 20px; border-radius:10px; background:var(--accent); color:var(--on-accent); text-decoration:none; font-weight:600; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/app-icon.png" alt="" width="40" height="40" />
    <h1>This link has expired</h1>
    <p>The person who shared it set a time limit, and it has passed. Ask them to share the file again.</p>
    <a href="/">Share a file</a>
  </div>
</body>
</html>
