<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FileShare Viewer</title>
  <link rel="stylesheet" href="/viewer.css" />
</head>
<body>
  <!-- Top bar (Google Docs style) -->
  <div class="topbar" id="topbar">
    <div class="topbar-left">
      <div class="logo">&#128196;</div>
      <div class="doc-info">
        <span class="doc-title" id="doc-title">Loading...</span>
        <span class="doc-meta" id="doc-meta"></span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="tb-btn" id="zoom-out-btn" title="Zoom out">&#x2212;</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="tb-btn" id="zoom-in-btn" title="Zoom in">&#x2b;</button>
      <div class="divider"></div>
      <button class="tb-btn" id="download-btn" title="Download">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download
      </button>
    </div>
  </div>

  <!-- Page nav (PDF only) -->
  <div class="page-nav hidden" id="page-nav">
    <button class="tb-btn" id="prev-page">&#8592;</button>
    <span id="page-info">Page 1 of 1</span>
    <button class="tb-btn" id="next-page">&#8594;</button>
  </div>

  <!-- Main viewer area -->
  <div class="viewer-shell" id="viewer-shell">
    <!-- Loading spinner -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>Loading document...</span>
    </div>

    <!-- PDF canvas container -->
    <div class="pdf-container hidden" id="pdf-container">
      <canvas id="pdf-canvas"></canvas>
    </div>

    <!-- Image viewer -->
    <div class="img-container hidden" id="img-container">
      <img id="img-viewer" alt="File preview" />
    </div>

    <!-- Text / code viewer -->
    <div class="text-container hidden" id="text-container">
      <div class="text-doc" id="text-doc"></div>
    </div>

    <!-- Video -->
    <div class="media-container hidden" id="video-container">
      <video id="video-player" controls></video>
    </div>

    <!-- Audio -->
    <div class="media-container hidden" id="audio-container">
      <div class="audio-card">
        <div class="audio-icon">&#127925;</div>
        <p class="audio-title" id="audio-title"></p>
        <audio id="audio-player" controls></audio>
      </div>
    </div>

    <!-- Unsupported -->
    <div class="unsupported hidden" id="unsupported">
      <div class="unsupported-icon">&#128196;</div>
      <p class="unsupported-title" id="unsupported-title"></p>
      <p class="unsupported-sub">This file type can't be previewed.</p>
      <button class="btn btn-primary" id="unsupported-download">Download File</button>
    </div>
  </div>

  <!-- PDF.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs" type="module"></script>
  <script type="module" src="/viewer.js"></script>
</body>
</html>
