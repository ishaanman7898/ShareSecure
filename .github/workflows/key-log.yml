# Watches the public key log (see public/kt.js), in public, every day: checks
# the whole log, and that every log it saw before is still the start of it.
# Each day's log is added to heads.jsonl on the key-log-witness branch, so the
# record of what the log looked like can't be changed by the server either.
name: Watch the key log

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get the record of earlier checks
        run: |
          if git ls-remote --exit-code --heads origin key-log-witness >/dev/null; then
            git worktree add witness origin/key-log-witness
            git -C witness switch -c key-log-witness
          else
            git worktree add --orphan -b key-log-witness witness
          fi

      - run: node scripts/kt-monitor.mjs --heads witness/heads.jsonl --write

      - name: Keep today's check
        run: |
          cd witness
          git add heads.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -m "Key log checked: $(tail -n 1 heads.jsonl)"
          git push origin key-log-witness
