# Watches the public key log (see public/kt.js), in public, every day: checks
# the whole log, and that every log it saw before is still the start of it.
#
# The record of earlier checks (heads.jsonl) is carried from run to run in the
# Actions cache, and each day's copy is attached to that day's run, so anyone
# can download it and compare. Records up to October 2026 are on the
# key-log-witness branch, which the first run here picks up. (The workflow used
# to push to that branch; the repository's branch rules now stop pushes from
# workflows, and the check doesn't need to push anything.)
name: Watch the key log

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get the record of earlier checks
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: witness/heads.jsonl
          key: key-log-heads-${{ github.run_id }}
          restore-keys: key-log-heads-

      - name: Or, the first time, the record on the key-log-witness branch
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p witness
          if git ls-remote --exit-code --heads origin key-log-witness >/dev/null; then
            git fetch origin key-log-witness
            git show origin/key-log-witness:heads.jsonl > witness/heads.jsonl
            echo "Started from the key-log-witness branch ($(wc -l < witness/heads.jsonl) earlier checks)."
          fi

      - run: node scripts/kt-monitor.mjs --heads witness/heads.jsonl --write

      - name: Keep today's record for tomorrow
        uses: actions/cache/save@v4
        with:
          path: witness/heads.jsonl
          key: key-log-heads-${{ github.run_id }}

      - name: Attach today's record to this run, for anyone to download
        uses: actions/upload-artifact@v4
        with:
          name: key-log-heads
          path: witness/heads.jsonl
          retention-days: 90
