# Builds the desktop app for every release tag and attaches the installers
# (plus the latest*.yml files the in-app updater reads) to that release.
# Run it by hand to rebuild an existing release, optionally for some platforms only.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to, e.g. v1.9.0
        required: true
      os:
        description: 'Platforms as JSON, e.g. ["macos-latest"]'
        default: '["windows-latest", "macos-latest", "ubuntu-latest"]'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["windows-latest", "macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # only so steps can check whether Windows signing is set up
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # macOS builds are signed with a Developer ID and notarized once the Apple
      # secrets exist (they belong on this step, where electron-builder runs).
      # Until then they're signed ad hoc: Apple Silicon Macs refuse to run
      # completely unsigned code and call the app "damaged". Windows is signed
      # after the build (below) and Linux isn't. See docs/SIGNING.md.
      # Missing secrets arrive as empty strings, which electron-builder would read
      # as a certificate path, so unset them.
      # 7-Zip packs ARM64 Windows code with its ARM64 filter, which the NSIS
      # installer can't unpack: it silently skips every .exe and .dll. BCJ is
      # one it can.
      - name: Build
        shell: bash
        env:
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          args=()
          if [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "$RUNNER_OS" = "macOS" ]; then args+=("-c.mac.identity=-"); fi
          fi
          npx electron-builder --publish never "${args[@]}"

      - name: Check the macOS apps are signed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in dist/mac*/ShareSecure.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|flags'
          done

      # Windows installers are signed through SignPath once its secrets exist
      # (see docs/SIGNING.md). SignPath only signs what this workflow built, so
      # the installer goes up as a build artifact and comes back signed. Signing
      # changes its bytes, so the hash the updater checks is worked out again.
      - name: Upload the Windows installer for signing
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/ShareSecure-Setup.exe
          if-no-files-found: error

      - name: Sign the Windows installer
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: sharesecure
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Point the updater at the signed installer
        if: steps.unsigned.outcome == 'success'
        shell: bash
        run: |
          node scripts/refresh-update-info.mjs dist/latest.yml
          powershell -Command "(Get-AuthenticodeSignature dist/ShareSecure-Setup.exe).Status" | tee /dev/stderr | grep -q '^Valid'

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
