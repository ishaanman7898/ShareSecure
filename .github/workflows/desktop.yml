# Builds the desktop app for every release tag and attaches the installers
# (plus the latest*.yml files the in-app updater reads) to that release.
# Run it by hand to rebuild an existing release, optionally for some platforms only.
name: Desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installers to, e.g. v1.9.0
        required: true
      os:
        description: 'Platforms as JSON, e.g. ["macos-latest"]'
        default: '["windows-latest", "macos-latest", "ubuntu-latest"]'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["windows-latest", "macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # macOS builds are signed with a Developer ID and notarized once the Apple
      # secrets exist. Until then they're signed ad hoc: Apple Silicon Macs refuse
      # to run completely unsigned code and call the app "damaged". Windows and
      # Linux build unsigned. See docs/SIGNING.md.
      # Missing secrets arrive as empty strings, which electron-builder would read
      # as a certificate path, so unset them.
      - name: Build
        shell: bash
        run: |
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          args=()
          if [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            if [ "$RUNNER_OS" = "macOS" ]; then args+=("-c.mac.identity=-"); fi
          fi
          npx electron-builder --publish never "${args[@]}"

      - name: Check the macOS apps are signed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for app in dist/mac*/ShareSecure.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|flags'
          done
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
